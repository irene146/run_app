<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Irene Marathon Coach</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
  --accent:#5cd399;--accent2:#dff9ec;--blue:#e8f1ff;--purple:#f0eaff;--orange:#fff1df;
  --danger:#fee2e2;--dangerInk:#991b1b;--warn:#fff7d6;--shadow:0 10px 28px rgba(17,24,39,.07);
  --radius:20px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.shell{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}
.brand{font-size:13px;font-weight:850;letter-spacing:.10em;text-transform:uppercase}
.version{font-size:11px;color:var(--muted);font-weight:700}
.hero{background:var(--ink);color:white;border-radius:26px;padding:22px 20px;margin:6px 0 14px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.1em;opacity:.67}
.hero h1{font-size:30px;line-height:1.02;margin:8px 0 10px;letter-spacing:-.035em}
.hero .sub{font-size:14px;line-height:1.45;color:#d1d5db}
.hero .goalrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.10);font-size:12px;font-weight:750}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:0 4px 15px rgba(17,24,39,.035)}
.card.tight{padding:13px 15px}
.sectiontitle{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.sectiontitle h2{font-size:19px;margin:0;letter-spacing:-.02em}
.sectiontitle span{font-size:12px;color:var(--muted);font-weight:650}
.workoutHead{display:flex;gap:13px;align-items:flex-start}
.iconBubble{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;background:var(--blue)}
.iconBubble.swim{background:#e2f7fb}.iconBubble.climb{background:var(--purple)}.iconBubble.rest{background:#f0f1f3}.iconBubble.long{background:var(--accent2)}
.workoutTitle{font-size:20px;font-weight:850;letter-spacing:-.025em;line-height:1.1}
.workoutMeta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
.targetPace{margin:14px 0 4px;padding:12px 13px;border-radius:14px;background:#f7f8fa;display:flex;justify-content:space-between;align-items:center;gap:10px}
.targetPace .bigPace{font-size:20px;font-weight:850}
.targetPace .paceLabel{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase}
.coach{background:var(--accent2);border:0}
.coach strong{display:block;font-size:13px;margin-bottom:4px}
.coach p{font-size:13px;line-height:1.48;margin:0;color:#244638}
.warn{background:var(--warn);border:0}.danger{background:var(--danger);border:0;color:var(--dangerInk)}
.primary{width:100%;border:0;border-radius:14px;padding:13px 15px;background:var(--ink);color:white;font-weight:800;font-size:15px;margin-top:12px}
.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:11px 13px;font-weight:750}
.ghost{border:0;background:#f2f3f5;color:var(--ink);border-radius:13px;padding:11px 13px;font-weight:750}
.weekStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 2px}
.dayChip{text-align:center;padding:8px 2px;border-radius:13px;min-width:0}
.dayChip .dow{font-size:10px;color:var(--muted);font-weight:800}
.dayChip .num{font-size:14px;font-weight:850;margin-top:5px}
.dayChip.hasRun{background:var(--blue)} .dayChip.today{outline:2px solid var(--ink)} .dayChip.done{background:var(--accent2)}
.weekRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.weekRow:first-child{border-top:0}
.rowLeft{display:flex;align-items:center;gap:11px;min-width:0}
.dayLabel{width:38px;font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase;flex:0 0 auto}
.rowName{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowDetail{font-size:11px;color:var(--muted);margin-top:3px}
.status{font-size:10px;font-weight:850;border-radius:999px;padding:6px 8px;background:#f1f2f4;white-space:nowrap}
.status.core{background:var(--blue)}.status.optional{background:var(--orange)}.status.logged{background:var(--accent2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:16px;background:#f7f8fa}
.stat .num{font-size:23px;font-weight:900;letter-spacing:-.04em}
.stat .lab{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.25}
.progressTrack{height:11px;border-radius:999px;background:#eceff2;overflow:hidden}
.progressFill{height:100%;border-radius:999px;background:var(--accent)}
.sparkWrap{height:100px;margin-top:10px}
.sparkWrap svg{width:100%;height:100%}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:20}
.tabBtn{border:0;background:transparent;padding:7px 2px 4px;color:var(--muted);font-size:10px;font-weight:800}
.tabBtn .tabIcon{font-size:20px;display:block;margin-bottom:2px}
.tabBtn.active{color:var(--ink)}
.panel{display:none}.panel.active{display:block}
.phaseTag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0f1f3;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{font-weight:800;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.breakdown{margin-top:10px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0}
.stepNo{width:27px;height:27px;border-radius:9px;background:#f0f1f3;display:grid;place-items:center;font-size:11px;font-weight:850}
.stepTitle{font-size:13px;font-weight:800}.stepText{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white;color:var(--ink);font-size:16px}
textarea{min-height:76px;resize:vertical}
.check{display:flex;align-items:center;gap:9px;margin-top:13px}
.check input{width:auto}
.modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,.52);z-index:50;padding:18px;overflow:auto}
.modal.open{display:block}
.modalCard{max-width:540px;margin:30px auto;background:white;border-radius:24px;padding:18px}
.modalTitle{font-size:22px;font-weight:900;margin:0 0 4px}
.feedback{font-size:13px;line-height:1.5;padding:12px;border-radius:13px;background:var(--accent2);margin-top:12px}
.uploadZone{border:1.5px dashed #cbd5e1;border-radius:16px;padding:16px;text-align:center;background:#fafbfc}
.small{font-size:11px;color:var(--muted);line-height:1.45}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:420px){
  .hero h1{font-size:27px}
  .grid2{grid-template-columns:1fr 1fr}
  .stat .num{font-size:20px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">Marathon Coach</div>
    <div class="version">v2 · Sep 2026</div>
  </div>

  <section id="today" class="panel active">
    <div id="todayHero"></div>
    <div id="todayWorkout"></div>
    <div id="coachCard"></div>
    <div class="sectiontitle"><h2>This week</h2><span id="weekKm"></span></div>
    <div class="card" id="weekMini"></div>
  </section>

  <section id="plan" class="panel">
    <div class="sectiontitle"><h2>Your plan</h2><span>adaptive</span></div>
    <div id="planWeeks"></div>
  </section>

  <section id="progress" class="panel">
    <div class="sectiontitle"><h2>Progress</h2><span>fitness + consistency</span></div>
    <div id="progressCards"></div>
  </section>

  <section id="coach" class="panel">
    <div class="sectiontitle"><h2>Coach & settings</h2><span>make it yours</span></div>
    <div id="coachSettings"></div>
  </section>
</div>

<nav class="tabs" aria-label="Main navigation">
  <button class="tabBtn active" data-tab="today"><span class="tabIcon">⌂</span>Today</button>
  <button class="tabBtn" data-tab="plan"><span class="tabIcon">▦</span>Plan</button>
  <button class="tabBtn" data-tab="progress"><span class="tabIcon">↗</span>Progress</button>
  <button class="tabBtn" data-tab="coach"><span class="tabIcon">●</span>Coach</button>
</nav>

<div class="modal" id="logModal" aria-hidden="true">
  <div class="modalCard">
    <div class="modalTitle">How did it go?</div>
    <div class="small" id="logSessionInfo"></div>
    <form id="logForm">
      <input type="hidden" id="logDate">
      <label for="logOutcome">Outcome</label>
      <select id="logOutcome">
        <option value="yes">Completed</option>
        <option value="partial">Partly completed</option>
        <option value="no">Skipped</option>
      </select>
      <div class="grid2">
        <div><label for="logKm">Distance (km)</label><input id="logKm" type="number" min="0" step="0.01"></div>
        <div><label for="logMin">Time (min)</label><input id="logMin" type="number" min="0" step="0.1"></div>
      </div>
      <div class="grid2">
        <div><label for="logRpe">RPE 1–10</label><input id="logRpe" type="number" min="1" max="10" step="1"></div>
        <div><label for="logHr">Average HR</label><input id="logHr" type="number" min="40" max="230" step="1"></div>
      </div>
      <label for="logFeel">How did you feel?</label>
      <select id="logFeel">
        <option value="good">Good / controlled</option>
        <option value="normal">Normal</option>
        <option value="tired">Tired / heavy</option>
        <option value="bad">Poor</option>
      </select>
      <div class="check"><input id="logPain" type="checkbox"><label for="logPain" style="margin:0">Pain or niggle affected the run</label></div>
      <label for="logNotes">Notes</label>
      <textarea id="logNotes" placeholder="Legs, breathing, sleep, treadmill, weather, etc."></textarea>
      <div id="logFeedback"></div>
      <div class="grid2" style="margin-top:14px">
        <button class="secondary" type="button" id="cancelLog">Cancel</button>
        <button class="primary" type="submit" style="margin:0">Save & adapt</button>
      </div>
    </form>
  </div>
</div>

<script>
const APP_VERSION = "2.0.0";
const PLAN_START = new Date("2026-09-21T12:00:00");
const SHIP_START = new Date("2027-01-28T12:00:00");
const SHIP_END = new Date("2027-03-28T12:00:00");
const DEFAULT_RACE = "2027-04-25";
const DAY = 86400000;
const BOOTSTRAP_STRAVA = {"generated": "2026-09-25", "source": "Strava export uploaded 25 Sep 2026", "last28_km": 40.8, "last28_runs": 6, "last14_km": 23.36, "longest_recent_km": 13.0, "recent_runs": [{"date": "2026-08-18", "km": 5.0, "pace_sec": 363, "hr": 165, "elev": 66.8}, {"date": "2026-08-30", "km": 7.0, "pace_sec": 378, "hr": 167, "elev": 50.6}, {"date": "2026-09-01", "km": 5.0, "pace_sec": 401, "hr": 142, "elev": 71.9}, {"date": "2026-09-08", "km": 5.44, "pace_sec": 353, "hr": null, "elev": 0.0}, {"date": "2026-09-19", "km": 13.0, "pace_sec": 426, "hr": 160, "elev": 117.0}, {"date": "2026-09-22", "km": 5.01, "pace_sec": 389, "hr": 151, "elev": 71.6}, {"date": "2026-09-24", "km": 5.35, "pace_sec": 363, "hr": 161, "elev": 9.1}], "historical": {"best_5kish": {"date": "2026-06-09", "km": 5.01, "pace_sec": 295, "time": "24:36"}, "best_10k": {"date": "2025-11-28", "km": 10.0, "pace_sec": 306, "time": "51:00"}, "marathon_2024": {"time": "4:32", "distance_km": 42.38}}};

let logs = JSON.parse(localStorage.getItem("marathonLogs") || "{}"); // preserves v1 data
let settings = JSON.parse(localStorage.getItem("marathonCoachSettingsV2") || "null") || {
  goalMinutes:230, // 3:50
  raceDate:DEFAULT_RACE,
  stretchMinutes:225,
  normalRuns:3,
  swimDay:2, // Tue
  climbDay:3 // Wed
};
let strava = JSON.parse(localStorage.getItem("marathonStravaV2") || "null") || BOOTSTRAP_STRAVA;

function saveAll(){
  localStorage.setItem("marathonLogs",JSON.stringify(logs));
  localStorage.setItem("marathonCoachSettingsV2",JSON.stringify(settings));
  localStorage.setItem("marathonStravaV2",JSON.stringify(strava));
}

function noon(d){const x=new Date(d);x.setHours(12,0,0,0);return x}
function today(){return noon(new Date())}
function iso(d){return noon(d).toISOString().slice(0,10)}
function parseDate(s){return new Date(s+"T12:00:00")}
function addDays(d,n){const x=noon(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=noon(d);const day=(x.getDay()+6)%7;return addDays(x,-day)}
function fmt(d,opts={weekday:"short",day:"numeric",month:"short"}){return d.toLocaleDateString("en-GB",opts)}
function fmtShort(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function toPace(sec){const s=Math.round(sec);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}/km`}
function goalPace(){return settings.goalMinutes*60/42.195}
function goalTimeText(mins=settings.goalMinutes){return `${Math.floor(mins/60)}:${String(mins%60).padStart(2,"0")}`}
function weekIndex(d){return Math.floor((startOfWeek(d)-startOfWeek(PLAN_START))/(7*DAY))}
function phase(d){
  if(d < new Date("2026-10-05T12:00:00")) return "Rebuild";
  if(d < new Date("2026-11-02T12:00:00")) return "Build";
  if(d < new Date("2027-01-04T12:00:00")) return "Base";
  if(d < SHIP_START) return "Marathon prep";
  if(d <= SHIP_END) return "Treadmill block";
  if(d < addDays(parseDate(settings.raceDate),-14)) return "Back outdoors";
  return "Taper";
}
function phaseText(p){
  return ({
    "Rebuild":"Rebuild consistency",
    "Build":"Build durability",
    "Base":"Build the engine",
    "Marathon prep":"Marathon preparation",
    "Treadmill block":"Ship treadmill block",
    "Back outdoors":"Road reacclimatisation",
    "Taper":"Taper & sharpen"
  })[p]||p;
}

function adaptation(now=today()){
  const cutoff=addDays(now,-10);
  const entries=Object.entries(logs).filter(([ds,l])=>{
    const d=parseDate(ds);return d>=cutoff&&d<=now&&l&&l.outcome!=="no";
  });
  const recent=entries.map(([,l])=>l);
  const pain=recent.some(l=>l.pain);
  const rpes=recent.map(l=>Number(l.rpe)).filter(v=>Number.isFinite(v)&&v>0);
  const avg=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  const tired=recent.filter(l=>l.feel==="tired"||l.feel==="bad").length;
  if(pain) return {level:"protect",volume:.78,paceAdj:15,quality:false,msg:"A niggle was logged recently, so the next quality run is converted to easy running and planned volume is reduced."};
  if((avg!==null&&avg>=7.2)||tired>=2) return {level:"backoff",volume:.88,paceAdj:10,quality:false,msg:"Recent sessions look harder than intended. The app is backing off the next quality session and trimming volume."};
  if(avg!==null&&avg<=5.2&&recent.length>=3) return {level:"good",volume:1,paceAdj:0,quality:true,msg:"Recovery looks good. Keep the planned progression — no need to add extra intensity."};
  return {level:"steady",volume:1,paceAdj:0,quality:true,msg:"You are rebuilding well. The priority is still consistency, not proving fitness in every run."};
}

function paceRange(type,d,adapt=adaptation()){
  const p=phase(d), gp=goalPace();
  let r;
  if(p==="Rebuild"||p==="Build"){
    const z={
      recovery:[405,440], easy:[380,415], long:[385,425],
      steady:[355,375], tempo:[330,350], threshold:[318,335], reps:[310,328],
      mp:[gp-2,gp+8]
    }; r=z[type]||z.easy;
  } else if(p==="Base"){
    const z={
      recovery:[400,435], easy:[375,410], long:[380,415],
      steady:[348,365], tempo:[325,345], threshold:[313,330], reps:[302,318],
      mp:[gp-2,gp+7]
    }; r=z[type]||z.easy;
  } else {
    const z={
      recovery:[395,430], easy:[370,405], long:[375,410],
      steady:[342,360], tempo:[318,338], threshold:[308,325], reps:[298,315],
      mp:[gp-3,gp+5]
    }; r=z[type]||z.easy;
  }
  return [r[0]+adapt.paceAdj,r[1]+adapt.paceAdj];
}
function paceLabel(type,d){const r=paceRange(type,d);return `${toPace(r[0])} – ${toPace(r[1])}`}

const longProgression = [
  10,12,13,11.5,15,16,     // Sep21-Oct26
  17,18,14,19,20,16,20,17, // Nov-Dec
  18,20,21,18,22,23,20,    // late Dec-Jan
  22,24,25,27,21,28,25,30,23, // ship
  20,26,22,16,12,8
];

function longKm(w){
  if(w<0) return 10;
  return longProgression[Math.min(w,longProgression.length-1)] || 8;
}
function easyKm(w,p){
  if(p==="Rebuild") return 6;
  if(p==="Build") return clamp(6.5+(w-2)*.5,6.5,8);
  if(p==="Taper") return 5.5;
  if(p==="Treadmill block") return 8;
  return clamp(7+w*.10,7,8.5);
}
function optionalKm(p){return p==="Taper"?4:5}

function qualityWorkout(d,w){
  const p=phase(d);
  if(p==="Rebuild"){
    if(w<=0) return {name:"Easy + strides",km:6,type:"easy",steps:[
      ["Warm up","5 km easy", "easy"],
      ["Strides","4 × 20 sec relaxed fast, full walk/jog recovery","reps"],
      ["Cool down","Easy to finish","easy"]
    ]};
    return {name:"6 × 1 min brisk",km:7,type:"reps",steps:[
      ["Warm up","2 km easy","easy"],
      ["Main set","6 × 1 min brisk / 2 min easy jog","reps"],
      ["Cool down","Easy running to 7 km","easy"]
    ]};
  }
  if(p==="Build"){
    const seq=[
      {name:"5 × 2 min brisk",km:8,type:"reps",steps:[["Warm up","2 km easy","easy"],["Main set","5 × 2 min brisk / 2 min easy","reps"],["Cool down","Easy to 8 km","easy"]]},
      {name:"15 min steady",km:8.5,type:"steady",steps:[["Warm up","2 km easy","easy"],["Main set","15 min controlled steady","steady"],["Cool down","Easy to finish","easy"]]},
      {name:"Easy + strides",km:7,type:"easy",steps:[["Easy","6 km easy","easy"],["Strides","4–6 × 20 sec relaxed","reps"],["Finish","Easy","easy"]]},
      {name:"2 × 8 min tempo",km:9,type:"tempo",steps:[["Warm up","2 km easy","easy"],["Main set","2 × 8 min tempo / 3 min jog","tempo"],["Cool down","Easy to 9 km","easy"]]},
      {name:"3 × 7 min tempo",km:9,type:"tempo",steps:[["Warm up","2 km easy","easy"],["Main set","3 × 7 min tempo / 3 min jog","tempo"],["Cool down","Easy to 9 km","easy"]]}
    ];
    return seq[clamp(w-2,0,seq.length-1)];
  }
  if(p==="Base"){
    const cycle=((w%4)+4)%4;
    if(cycle===2) return {name:"Easy + strides",km:7.5,type:"easy",steps:[["Easy","6.5 km easy","easy"],["Strides","6 × 20 sec","reps"],["Finish","Easy","easy"]]};
    if(cycle===0) return {name:"3 × 8 min tempo",km:9.5,type:"tempo",steps:[["Warm up","2 km easy","easy"],["Main set","3 × 8 min tempo / 3 min easy","tempo"],["Cool down","Easy to finish","easy"]]};
    if(cycle===1) return {name:"5 × 4 min threshold",km:10,type:"threshold",steps:[["Warm up","2 km easy","easy"],["Main set","5 × 4 min controlled threshold / 2 min jog","threshold"],["Cool down","Easy to 10 km","easy"]]};
    return {name:"25 min tempo",km:10,type:"tempo",steps:[["Warm up","2 km easy","easy"],["Main set","25 min continuous tempo","tempo"],["Cool down","Easy to 10 km","easy"]]};
  }
  if(p==="Marathon prep"){
    return {name:"3 × 10 min tempo",km:10.5,type:"tempo",steps:[["Warm up","2 km easy","easy"],["Main set","3 × 10 min tempo / 3 min easy","tempo"],["Cool down","Easy to finish","easy"]]};
  }
  if(p==="Treadmill block"){
    const sw=Math.max(0,Math.floor((d-SHIP_START)/(7*DAY)));
    const arr=[
      {name:"3 × 10 min tempo",km:10,type:"tempo",steps:[["Warm up","2 km easy, 0.5–1% incline","easy"],["Main set","3 × 10 min tempo / 3 min easy","tempo"],["Cool down","Easy to 10 km","easy"]]},
      {name:"3 × 3 km marathon effort",km:12,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","3 × 3 km at marathon effort / 1 km easy","mp"],["Cool down","Easy","easy"]]},
      {name:"2 × 5 km marathon effort",km:13,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","2 × 5 km at marathon effort / 1 km easy","mp"],["Cool down","Easy","easy"]]},
      {name:"Cutback steady",km:8,type:"steady",steps:[["Easy","3 km easy","easy"],["Steady","3 km steady","steady"],["Easy","2 km easy","easy"]]},
      {name:"10 km marathon effort",km:13,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","10 km continuous at marathon effort","mp"],["Cool down","1 km easy","easy"]]},
      {name:"5 × 5 min threshold",km:10,type:"threshold",steps:[["Warm up","2 km easy","easy"],["Main set","5 × 5 min threshold / 2 min easy","threshold"],["Cool down","Easy","easy"]]},
      {name:"2 × 5 km marathon effort",km:13,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","2 × 5 km marathon effort / 1 km easy","mp"],["Cool down","Easy","easy"]]},
      {name:"Controlled MP",km:9,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","5 km marathon effort","mp"],["Cool down","2 km easy","easy"]]}
    ];
    return arr[Math.min(sw,arr.length-1)];
  }
  if(p==="Back outdoors"){
    return {name:"Road marathon effort",km:9,type:"mp",steps:[["Warm up","2 km easy outdoors","easy"],["Main set","5 km marathon effort","mp"],["Cool down","2 km easy","easy"]]};
  }
  return {name:"Short marathon-pace touch",km:7,type:"mp",steps:[["Warm up","2 km easy","easy"],["Main set","3 km marathon effort","mp"],["Cool down","2 km easy","easy"]]};
}

function runSession(date,name,km,type,priority="Core",steps=null,note=""){
  return {date:iso(date),kind:"Run",name,km,type,priority,steps,note};
}
function other(date,kind,name,priority="Core",note=""){return {date:iso(date),kind,name,priority,note}}

function plannedWeek(w){
  const mon=addDays(startOfWeek(PLAN_START),w*7);
  const race=parseDate(settings.raceDate);
  if(mon>race) return [];
  const p=phase(mon);
  const a=adaptation();
  let q=qualityWorkout(addDays(mon,3),w);
  if(!a.quality && ["tempo","threshold","reps","steady","mp"].includes(q.type)){
    q={name:"Easy run — adapted",km:Math.max(6,Math.round(q.km*.85*2)/2),type:"easy",steps:[["Easy","Keep the whole run conversational","easy"]]};
  }
  const ek=Math.round(easyKm(w,p)*a.volume*2)/2;
  const lk=Math.round(longKm(w)*a.volume*2)/2;
  const qk=Math.round(q.km*a.volume*2)/2;
  const ship=mon>=SHIP_START && mon<=SHIP_END;
  const transitionToShip=mon<SHIP_START && addDays(mon,6)>=SHIP_START;

  // Race week special
  if(race>=mon && race<=addDays(mon,6)){
    const sessions=[
      runSession(mon,"Easy + strides",5,"easy","Core",[["Easy","4 km easy","easy"],["Strides","4 × 20 sec relaxed","reps"]],"Stay fresh."),
      other(addDays(mon,1),"Rest","Rest / gentle mobility","Recovery"),
      other(addDays(mon,2),"Rest","Rest","Recovery"),
      runSession(addDays(mon,3),"Shakeout",4,"easy","Core",[["Easy","4 km very easy","easy"]],"Stop wanting more."),
      other(addDays(mon,4),"Rest","Rest","Recovery"),
      other(addDays(mon,5),"Rest","Rest / race prep","Recovery"),
      other(addDays(mon,6),"Rest","Rest / race prep","Recovery")
    ];
    const idx=Math.round((race-mon)/DAY);
    sessions[idx]=runSession(race,"LONDON MARATHON",42.195,"mp","Race",[
      ["Start","First 5 km slightly calmer than goal pace","easy"],
      ["Settle","5–30 km at controlled marathon effort","mp"],
      ["Race","30 km onward: effort, not ego","mp"]
    ],"Race the fitness you have, not the number you wanted months ago.");
    return sessions;
  }

  if(transitionToShip){
    return [
      runSession(mon,"Easy run",ek,"easy","Core",[["Easy",`${ek} km conversational`,"easy"]],"Recovery from Sunday."),
      other(addDays(mon,1),"Swim","Swim 3–4 km","Core","Final normal Tuesday swim before the ship block."),
      other(addDays(mon,2),"Climb","Climbing","Core","Final normal Wednesday climbing session before the ship block."),
      runSession(addDays(mon,3),q.name,qk,q.type,"Core",q.steps,"First treadmill quality session if already aboard."),
      other(addDays(mon,4),"Rest","Rest","Recovery"),
      runSession(addDays(mon,5),"Recovery treadmill",optionalKm(p),"recovery","Optional",[["Easy",`${optionalKm(p)} km very easy`,"recovery"]],"Only if settled and recovered."),
      runSession(addDays(mon,6),"Long treadmill",lk,"long","Core",[["Long",`${lk} km easy`,"long"]],"First ship long run; keep it controlled.")
    ];
  }

  if(ship){
    return [
      runSession(mon,"Easy treadmill",ek,"easy","Core",[["Easy",`${ek} km easy`, "easy"]],"0.5–1% incline if comfortable."),
      other(addDays(mon,1),"Rest","Rest / mobility","Recovery","No pool available during ship block."),
      other(addDays(mon,2),"Rest","Rest / mobility","Recovery"),
      runSession(addDays(mon,3),q.name,qk,q.type,"Core",q.steps),
      other(addDays(mon,4),"Rest","Rest","Recovery"),
      runSession(addDays(mon,5),"Recovery treadmill",optionalKm(p),"recovery","Optional",[["Easy",`${optionalKm(p)} km very easy`,"recovery"]],"Skip if tired."),
      runSession(addDays(mon,6),"Long treadmill",lk,"long","Core",[["Long",`${lk} km easy`, "long"]],"Fuel and hydrate exactly as you plan to on race day.")
    ];
  }

  return [
    runSession(mon,"Easy run",ek,"easy","Core",[["Easy",`${ek} km conversational`,"easy"]],"Recovery from Sunday."),
    other(addDays(mon,1),"Swim","Swim 3–4 km","Core","Your normal Tuesday swim."),
    other(addDays(mon,2),"Climb","Climbing","Core",p==="Taper"?"Keep it light; stop completely in final 10–14 days.":"Normal Wednesday climbing."),
    runSession(addDays(mon,3),q.name,qk,q.type,"Core",q.steps),
    other(addDays(mon,4),"Rest","Rest","Recovery"),
    runSession(addDays(mon,5),"Recovery run",optionalKm(p),"recovery","Optional",[["Easy",`${optionalKm(p)} km very easy`,"recovery"]],"Only if you feel recovered."),
    runSession(addDays(mon,6),"Long run",lk,"long","Core",[["Long",`${lk} km easy`, "long"]],"Conversational effort; pace is secondary.")
  ];
}

function allSessions(){
  let out=[];
  const race=parseDate(settings.raceDate);
  for(let w=0;w<40;w++) out.push(...plannedWeek(w));
  return out.filter(s=>parseDate(s.date)<=race);
}

function sessionIcon(s){
  if(s.kind==="Swim") return "≈";
  if(s.kind==="Climb") return "△";
  if(s.kind==="Rest") return "·";
  if(s.name.includes("Long")) return "↗";
  if(s.name.includes("LONDON")) return "★";
  return "⌁";

function iconClass(s){
  if(s.kind==="Swim")return"swim";
  if(s.kind==="Climb")return"climb";
  if(s.kind==="Rest")return"rest";

function sessionPace(s){

}

function todaySession(){

}

function nextRun(from=today()){
  return allSessions().find(s=>parseDate(s.date)>=from && s.kind==="Run");
}

function postRunFeedback(s,l){
  if(l.outcome==="no") return "No catch-up session is added. Continue with the next planned workout.";
  if(l.pain) return "Because you flagged pain, the app will automatically soften your next quality session and reduce short-term volume.";
  if(!l.km||!l.minutes) return "Saved. Add distance and time next time for pace-specific feedback.";
  const sec=l.minutes*60/l.km;
  const r=paceRange(s.type||"easy",parseDate(s.date),{paceAdj:0});
  if(["easy","long","recovery"].includes(s.type) && sec<r[0]-8 && Number(l.rpe)>=5){
    return `You averaged ${toPace(sec)}, faster than the intended easy range. You got the work done, but the next easy/long run should be genuinely easier.`;
  }
  if(Number(l.rpe)>=8) return "That landed harder than planned. The adaptive coach will back off the next quality session.";
  if(Number(l.rpe)<=5 && ["easy","long","recovery"].includes(s.type)) return "Exactly what we want: controlled aerobic work. Keep stacking these rather than making the next run harder.";
  return "Logged. The next sessions will use this alongside your recent RPE, fatigue and niggle flags.";
}

function weeklyStravaData(){
  const runs=(strava.recent_runs||[]).map(r=>({...r,d:parseDate(r.date)})).sort((a,b)=>a.d-b.d);
  const by={};
  runs.forEach(r=>{
    const k=iso(startOfWeek(r.d));
    by[k]=(by[k]||0)+Number(r.km||0);
  });
  return Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).slice(-8);
}
function sparkSVG(vals){
  if(!vals.length)return"";
  const w=300,h=86,p=8,max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[p+(w-2*p)*(i/(Math.max(1,vals.length-1))),h-p-(h-2*p)*(v/max)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Recent weekly running distance">
    <path d="${path}" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#5cd399" stroke="#111827" stroke-width="1.5"/>`).join("")}
  </svg>`;
}

function parseCSV(text){
  const rows=[];let row=[],field="",quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(quote){
      if(c==='"'&&n==='"'){field+='"';i++}
      else if(c==='"')quote=false;
      else field+=c;
    }else{
      if(c==='"')quote=true;
      else if(c===','){row.push(field);field=""}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field=""}
      else if(c!=='\r')field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row)}
  return rows;
}
function parseStravaDate(s){
  const d=new Date(s);return isNaN(d)?null:noon(d);
}
async function handleStravaImport(e){
  const file=e.target.files[0]; if(!file)return;
  try{
    const rows=parseCSV(await file.text());
    const headers=rows[0];
    const idx=n=>headers.indexOf(n);
    const iType=idx("Activity Type"), iDate=idx("Activity Date"), iDist=idx("Distance");
    const iMove=idx("Moving Time"), iHr=idx("Average Heart Rate"), iElev=idx("Elevation Gain");
    if([iType,iDate,iDist].some(i=>i<0)) throw new Error("This does not look like a Strava activities export.");
    const rr=rows.slice(1).map(r=>{
      if((r[iType]||"").toLowerCase()!=="run")return null;
      const d=parseStravaDate(r[iDate]); if(!d)return null;
      const km=Number(r[iDist]); if(!Number.isFinite(km)||km<=0)return null;
      const mov=Number(r[iMove]), hr=Number(r[iHr]), elev=Number(r[iElev]);
      return {date:iso(d),d,km,pace_sec:Number.isFinite(mov)&&mov>0?mov/km:null,hr:Number.isFinite(hr)?hr:null,elev:Number.isFinite(elev)?elev:null};
    }).filter(Boolean).sort((a,b)=>a.d-b.d);
    if(!rr.length)throw new Error("No runs found in that file.");
    const latest=rr[rr.length-1].d, c28=addDays(latest,-27), c14=addDays(latest,-13);
    const r28=rr.filter(r=>r.d>=c28), r14=rr.filter(r=>r.d>=c14);
    strava={
      generated:iso(latest),
      source:file.name,
      last28_km:r28.reduce((a,r)=>a+r.km,0),
      last28_runs:r28.length,
      last14_km:r14.reduce((a,r)=>a+r.km,0),
      longest_recent_km:Math.max(...r28.map(r=>r.km)),
      recent_runs:rr.slice(-20).map(({d,...x})=>x),
      historical:strava.historical||BOOTSTRAP_STRAVA.historical
    };
    saveAll();
    document.getElementById("importMsg").innerHTML=`<div class="feedback">Imported ${rr.length} runs. Latest run: ${fmt(latest)}. Your fitness snapshot has been updated.</div>`;
    renderProgress();
  }catch(err){
    document.getElementById("importMsg").innerHTML=`<div class="feedback" style="background:var(--danger);color:var(--dangerInk)">${err.message}</div>`;
  }
  e.target.value="";
}

function openLog(date){
  const s=allSessions().find(x=>x.date===date); if(!s)return;
  const l=logs[date]||{};
  document.getElementById("logDate").value=date;
  document.getElementById("logSessionInfo").textContent=`${fmt(parseDate(date))} · ${s.name}${s.km?` · planned ${s.km} km`:""}`;
  document.getElementById("logOutcome").value=l.outcome||"yes";
  document.getElementById("logKm").value=l.km??(s.kind==="Run"&&s.km?s.km:"");
  document.getElementById("logMin").value=l.minutes??"";
  document.getElementById("logRpe").value=l.rpe??"";
  document.getElementById("logHr").value=l.hr??"";
  document.getElementById("logFeel").value=l.feel||"normal";
  document.getElementById("logPain").checked=!!l.pain;
  document.getElementById("logNotes").value=l.notes||"";
  document.getElementById("logFeedback").innerHTML=l.outcome?`<div class="feedback">${postRunFeedback(s,l)}</div>`:"";
  document.getElementById("logModal").classList.add("open");
  document.getElementById("logModal").setAttribute("aria-hidden","false");
}
function closeLog(){
  document.getElementById("logModal").classList.remove("open");
  document.getElementById("logModal").setAttribute("aria-hidden","true");
}
document.getElementById("cancelLog").addEventListener("click",closeLog);
document.getElementById("logModal").addEventListener("click",e=>{if(e.target.id==="logModal")closeLog()});
document.getElementById("logForm").addEventListener("submit",e=>{
  e.preventDefault();
  const date=document.getElementById("logDate").value;
  const s=allSessions().find(x=>x.date===date);
  const l={
    outcome:document.getElementById("logOutcome").value,
    km:Number(document.getElementById("logKm").value)||0,
    minutes:Number(document.getElementById("logMin").value)||0,
    rpe:Number(document.getElementById("logRpe").value)||null,
    hr:Number(document.getElementById("logHr").value)||null,
    feel:document.getElementById("logFeel").value,
    pain:document.getElementById("logPain").checked,
    notes:document.getElementById("logNotes").value.trim(),
    savedAt:new Date().toISOString()
  };
  logs[date]=l;saveAll();
  document.getElementById("logFeedback").innerHTML=`<div class="feedback">${postRunFeedback(s,l)}</div>`;
  setTimeout(()=>{closeLog();renderAll()},500);
});

function exportBackup(){
  const data={version:APP_VERSION,exported:new Date().toISOString(),logs,settings,strava};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`marathon-coach-backup-${iso(today())}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d.logs)throw new Error("Invalid backup");
    logs=d.logs||logs;settings=d.settings||settings;strava=d.strava||strava;saveAll();renderAll();
    alert("Backup restored.");
  }catch(err){alert("Could not restore that backup.")}
  e.target.value="";
}

document.querySelectorAll(".tabBtn").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tabBtn").forEach(b=>b.classList.toggle("active",b===btn));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===btn.dataset.tab));
  window.scrollTo({top:0,behavior:"smooth"});
}));

function renderAll(){renderToday();renderPlan();renderProgress();renderCoach()}
renderAll();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./service-worker.js").then(reg=>reg.update()).catch(()=>{});
}
